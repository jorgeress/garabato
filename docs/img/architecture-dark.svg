<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 750" width="1360" height="750" role="img" aria-label="Arquitectura de Garabato: el reloj unico y la bifurcacion de la imagen"><rect width="1360" height="750" fill="#0d1117"/><text x="44" y="50" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="700" fill="#e6edf3" text-anchor="start">Lo que el flujo lineal no enseña</text><text x="44" y="76" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start">Dos decisiones de arquitectura que no se ven en la lista de pasos.</text><rect x="44" y="96" width="1272" height="228" rx="14" fill="#12161d" stroke="#2b313a" stroke-width="1.5"/><text x="72" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3" text-anchor="start">1 · Una sola línea de tiempo</text><text x="72" y="154" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">generate_voice.py fija el reloj. Las imágenes y los subtítulos leen el mismo, por eso no se separan del audio.</text><rect x="72" y="186" width="228" height="52" rx="8" fill="#161b22" stroke="#2b313a" stroke-width="1.5"/><text x="186.0" y="217.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">generate_voice.py</text><rect x="352" y="176" width="214" height="60" rx="8" fill="#241d0c" stroke="#d9a520" stroke-width="2"/><text x="459.0" y="203.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">beat_timings.json</text><text x="459.0" y="223.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="middle">start/end de cada beat</text><rect x="352" y="254" width="214" height="48" rx="8" fill="#161b22" stroke="#2b313a" stroke-width="1.5"/><text x="459.0" y="283.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">narration.mp3</text><rect x="636" y="166" width="268" height="56" rx="8" fill="#161b22" stroke="#2b313a" stroke-width="1.5"/><text x="770.0" y="191.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">generate_image_prompts.py</text><text x="770.0" y="211.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="middle">coloca cada imagen</text><rect x="636" y="240" width="268" height="56" rx="8" fill="#161b22" stroke="#2b313a" stroke-width="1.5"/><text x="770.0" y="265.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">generate_subtitles.py</text><text x="770.0" y="285.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="middle">alinea cada palabra</text><path d="M 300 212 L 326.0 212 Q 332.0 212 332.0 206 L 332.0 206 L 343 206" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 352 206 L 342 200 L 342 212 Z" fill="#8b949e"/><path d="M 300 212 L 326.0 212 Q 332.0 212 332.0 218 L 332.0 278 L 343 278" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 352 278 L 342 272 L 342 284 Z" fill="#8b949e"/><path d="M 566 206 L 601.0 206 Q 607.0 206 607.0 200 L 607.0 194 L 627 194" fill="none" stroke="#d9a520" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 636 194 L 626 188 L 626 200 Z" fill="#d9a520"/><path d="M 566 206 L 601.0 206 Q 607.0 206 607.0 212 L 607.0 268 L 627 268" fill="none" stroke="#d9a520" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 636 268 L 626 262 L 626 274 Z" fill="#d9a520"/><rect x="964" y="196" width="284" height="76" rx="8" fill="none" stroke="#2b313a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1106" y="224" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b949e" text-anchor="middle">MEDIDO</text><text x="1106" y="250" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">0,05 s de deriva en 83 beats</text><rect x="44" y="350" width="1272" height="356" rx="14" fill="#12161d" stroke="#2b313a" stroke-width="1.5"/><text x="72" y="386" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3" text-anchor="start">2 · Dónde se decide de dónde sale cada imagen</text><text x="72" y="408" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">La bifurcación ocurre al construir los prompts, no al generar los clips. La elige CLIP_SOURCE.</text><rect x="72" y="498" width="232" height="56" rx="8" fill="#161b22" stroke="#2b313a" stroke-width="1.5"/><text x="188.0" y="523.0" font-family="ui-mo